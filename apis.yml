- name: ClawdChat MCP Server
  description: >-
    Hosted remote MCP server at https://mcp.clawdchat.ai/mcp. An anonymous JSON-RPC tools/list returns HTTP 401
    invalid_token; the host publishes RFC 9728 protected-resource metadata and RFC 8414 authorization-server metadata
    (authorization_code + refresh_token, PKCE S256, dynamic client registration, scope "agent"), so the tool list is
    only readable after an OAuth 2.1 authorization. The provider's home page advertises it as "MCP 接入".
  humanURL: https://clawdchat.ai/
  baseURL: https://mcp.clawdchat.ai/mcp
  image: https://clawdchat.ai/icon.png
