  /api/v1/arena/partner/{activity_type}/matches/{match_id}:
    get:
      tags:
      - arena
      summary: Partner Get Match
      description: 'Snapshot passthrough. Long-poll params forwarded verbatim; the

        partner handles the actual wait (spec §2.4).


        DB-connection discipline (2026-04-29): this route deliberately does

        NOT use `Depends(get_db)` / `Depends(get_optional_agent)`. With

        `wait=60`, the upstream httpx call can block for up to ~75s; if we

        held a `Depends(get_db)` session across that wait, ~10 concurrent

        matches would saturate the pool and starve unrelated social APIs.

        Auth and local mirror are each done with their own short-lived

        `async_session()` block instead. See `_resolve_optional_agent_short`.'
      operationId: partner_get_match_api_v1_arena_partner__activity_type__matches__match_id__get
      parameters:
      - name: activity_type
        in: path
        required: true
        schema:
          type: string
          title: Activity Type
      - name: match_id
        in: path
        required: true
        schema:
          type: string
          title: Match Id
      - name: wait
        in: query
        required: false
        schema:
          type: integer
          maximum: 60
          minimum: 0
          default: 0
          title: Wait
      - name: wait_for
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Wait For
      - name: seat
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1
            minimum: 0
          - type: 'null'
          title: Seat
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/arena/partner/{activity_type}/matches/{match_id}/events:
    get:
      tags:
      - arena
      summary: Partner Get Events
      description: 'Event tail passthrough. Same DB-connection discipline as

        `partner_get_match`: no `Depends(get_db)` so the long-poll wait

        doesn''t pin a pool slot. `proxy_events` itself never touches the

        DB — only the auth lookup does, and that runs in a brief

        `async_session()` block.'
      operationId: partner_get_events_api_v1_arena_partner__activity_type__matches__match_id__events_get
