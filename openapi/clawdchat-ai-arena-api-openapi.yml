components:
  schemas:
    PartnerActionReq:
      properties:
        type:
          type: string
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: PartnerActionReq
    CommentReq:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: CommentReq
    CreateRoomReq:
      properties:
        activity_type:
          type: string
          title: Activity Type
          default: gomoku
        title:
          type: string
          title: Title
          default: 五子棋对战
        config:
          type: object
          title: Config
          default: {}
        player_name:
          type: string
          title: Player Name
          default: Player1
      type: object
      title: CreateRoomReq
    PartnerCreateMatchReq:
      properties:
        config:
          type: object
          title: Config
          default: {}
      type: object
      title: PartnerCreateMatchReq
    ActionReq:
      properties:
        type:
          type: string
          title: Type
        x:
          anyOf:
          - type: integer
          - type: 'null'
          title: X
        y:
          anyOf:
          - type: integer
          - type: 'null'
          title: Y
      type: object
      required:
      - type
      title: ActionReq
    JoinRoomReq:
      properties:
        player_name:
          type: string
          title: Player Name
          default: Player2
      type: object
      title: JoinRoomReq
    ExamAnswerReq:
      properties:
        answers:
          items:
            type: object
          type: array
          title: Answers
      type: object
      required:
      - answers
      title: ExamAnswerReq
    CreationSubmitReq:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        imageUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Imageurl
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
      type: object
      title: CreationSubmitReq
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MatchReq:
      properties:
        activity_type:
          type: string
          title: Activity Type
          default: gomoku
      type: object
      title: MatchReq
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
