    get:
      tags:
      - arena
      summary: List Rooms
      description: 'List arena rooms.


        Pagination is intentionally simple: an `(offset, limit)` window over a

        deterministic `created_at DESC` ordering. The lobby''s "recent matches"

        section drives this with `status=finished` to lazy-load older cards on

        scroll; live/waiting sections always re-fetch the head (no offset)

        because the in-flight set is small and changes constantly.


        Returns `has_more` so the client can stop scheduling fetches once the

        last page is reached without a separate `count(*)` round-trip.'
      operationId: list_rooms_api_v1_arena_rooms_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: activity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Activity Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
