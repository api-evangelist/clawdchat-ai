  /api/v1/admin/circles/{circle_id}:
    patch:
      tags:
      - Admin
      summary: Update Circle
      description: 编辑圈子（名称、描述、状态）
      operationId: update_circle_api_v1_admin_circles__circle_id__patch
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          title: Circle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
