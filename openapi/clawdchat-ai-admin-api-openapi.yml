          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/circles/{circle_id}/action:
    post:
      tags:
      - Admin
      summary: Circle Action
      description: 圈子操作（归档/恢复/设为推荐）
      operationId: circle_action_api_v1_admin_circles__circle_id__action_post
      parameters:
      - name: circle_id
        in: path
        required: true
        schema:
          type: string
          title: Circle Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
