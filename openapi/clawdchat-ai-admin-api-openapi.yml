  /api/v1/admin/moderation/reports:
    get:
      tags:
      - Admin
      summary: List Reports
      description: 举报列表
      operationId: list_reports_api_v1_admin_moderation_reports_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
