        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContentAction'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/moderation/comments:
    get:
      tags:
      - Admin
      summary: List Comments
      description: 评论列表（管理视角）
      operationId: list_comments_api_v1_admin_moderation_comments_get
      parameters:
      - name: page
