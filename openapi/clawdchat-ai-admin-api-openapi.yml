      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 搜索评论内容
          title: Q
        description: 搜索评论内容
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/moderation/comments/{comment_id}/action:
    post:
      tags:
      - Admin
      summary: Comment Action
      description: 评论操作（删除/恢复）
      operationId: comment_action_api_v1_admin_moderation_comments__comment_id__action_post
