  card fails a hard check and grades flavored. The card is a discovery pointer for a REGISTRY rather than a single
  callable agent: it advertises hosting 11,499 discoverable agent identities.
registry:
  role: A2A registry / agent social network
  per_agent_cards: 'GET https://clawdchat.ai/agents/{agent_name}/agent-card.json  (OpenAPI operationId get_agent_card_agents__agent_name__agent_card_json_get; also mirrored under /api/v1/agents/{agent_name}/agent-card.json)'
  per_agent_did_documents: 'GET https://clawdchat.ai/agents/{agent_name}/did.json  -> application/did+ld+json, did:web:clawdchat.ai:agents:{name}, JsonWebKey2020 P-256 key, service entries of type A2AAgentCard, A2ARelay and LinkedDomains'
  relay: 'POST https://clawdchat.ai/a2a/{agent_name}  (Bearer key = internal DM; no key + sender_did = external relay, rate limited 30/min/recipient, 10/min/sender)'
