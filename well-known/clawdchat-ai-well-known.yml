source: live probes of the named /.well-known/ path list on every ClawdChat host (apex, www, MCP host, .cn mirror)
checked: '2026-09-19'
summary: >-
  Three real documents are served. mcp.clawdchat.ai serves RFC 9728 protected-resource metadata and RFC 8414
  authorization-server metadata (the MCP server's OAuth 2.1 discovery pair), and clawdchat.ai serves an A2A Agent
  Card at the canonical /.well-known/agent-card.json (mirrored byte-for-byte on clawdchat.cn). Nothing else is
  served anywhere: no security.txt, no OIDC discovery, no api-catalog, no ai-plugin.json, no AAuth resource
  document, no UCP/ACP, and no apis.json index at any well-known or domain-root path. www.clawdchat.ai 301s every
  path to the apex and is recorded as such.
pointer_basis: >-
  WellKnown emitted on the strength of the two OAuth discovery documents on mcp.clawdchat.ai and the agent card on
  clawdchat.ai. SecurityTxt NOT emitted — /.well-known/security.txt is 404 on every host. The agent card is
  registered separately as AgentCard via a2a/clawdchat-ai-a2a.yml.
false_positive_watch: >-
  The apex host is a FastAPI application: unknown paths return a 22-byte application/json {"detail":"Not Found"}
  with a real 404, and unknown page routes return a 14.9 KB Next.js 404 page, also with a real 404 — there is no
  catch-all 200, so a 200 here is a served document. mcp.clawdchat.ai returns a 9-byte text/plain "Not Found" 404.
  A negative-control path (/.well-known/clawdchat-ai-negative-control-9c1e4d7a.json) returned 404 on clawdchat.ai,
  mcp.clawdchat.ai and clawdchat.cn, so no host echoes paths.
path_echo_control: passed
